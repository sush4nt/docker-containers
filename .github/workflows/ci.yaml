name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: Build and smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build general spark

      - name: General profile
        run: |
          docker compose run --rm -T general \
            /envs/general/bin/python -c "import pandas, sklearn, xgboost, mlflow; print('general ok')"

      - name: Spark profile
        run: |
          docker compose run --rm -T spark \
            /envs/spark/bin/python -c "from pyspark.sql import SparkSession; print('spark ok', SparkSession.builder.master('local[1]').getOrCreate().range(5).count())"

      - name: Helper scripts
        run: |
          docker compose run --rm -T general bash -c "cd /tmp && mkenv ci 3.11 && addpkg ci requests && lsenv && rmenv ci"